name: Build and Release Aligned Client

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: aligned-x86
          - os: macos-latest
            artifact_name: aligned-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Build batcher client
        run: make build_batcher_client
      
      - name: Rename binary
        run: mv crates/target/release/aligned ${{ matrix.artifact_name }}
  
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.artifact_name }}
